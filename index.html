<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños!</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f7f3f9; color: #333; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: #6c5ce7; margin-bottom: 8px; }
        .card { background: #ffffff; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); }
        form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        input, textarea, button { width: 100%; padding: 12px; border: 1px solid #dfe6e9; border-radius: 6px; font-size: 1rem; }
        button { background-color: #6c5ce7; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #5b4bc4; }
        .messages-list { display: flex; flex-direction: column; gap: 12px; }
        .message-item { 
            background: #f9f9fb; 
            border-left: 4px solid #6c5ce7; 
            padding: 12px 16px; 
            border-radius: 4px; 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
        }
        .message-content { flex-grow: 1; margin-right: 12px; }
        .message-content strong { color: #2d3436; display: block; margin-bottom: 4px; }
        .delete-btn { 
            background: transparent; 
            border: none; 
            color: #d63031; 
            cursor: pointer; 
            font-size: 1.1rem; 
            padding: 2px 6px; 
            width: auto;
        }
        .delete-btn:hover { background: #ffeaa7; border-radius: 4px; }
        .status { font-weight: bold; color: #0984e3; margin-bottom: 12px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>¡Feliz Cumpleaños Inesita </h1>
            <p>Déjale tu mensaje de felicitación.</p>
        </header>

        <section class="card">
            <form id="messageForm">
                <input type="text" id="authorInput" placeholder="Tu nombre" required>
                <textarea id="messageInput" placeholder="Escribe tu mensaje aquí..." rows="3" required></textarea>
                <button type="submit" id="submitBtn">Guardar Mensaje</button>
            </form>
            <div id="statusMessage" class="status"></div>

            <h3>Mensajes recibidos:</h3>
            <br>
            <div id="messagesList" class="messages-list">
                <p>Cargando mensajes...</p>
            </div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, deleteDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Contraseña para poder eliminar mensajes
        const ADMIN_PASSWORD = "032010";

        const firebaseConfig = {
            apiKey: "AIzaSyBu3vbe4uBIBvd8TdE9HiLpZXN2eZxRR9k",
            authDomain: "cumpleanosapp-1054b.firebaseapp.com",
            projectId: "cumpleanosapp-1054b",
            storageBucket: "cumpleanosapp-1054b.firebasestorage.app",
            messagingSenderId: "232056764909",
            appId: "1:232056764909:web:b3479be0e70d0d3ff20fe4",
            measurementId: "G-8V7P3SXF18"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('messageForm');
        const authorInput = document.getElementById('authorInput');
        const messageInput = document.getElementById('messageInput');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');
        const messagesList = document.getElementById('messagesList');

        const messagesRef = collection(db, "birthday_posts");
        const postsQuery = query(messagesRef, orderBy("createdAt", "desc"));

        // Escuchar cambios en tiempo real
        onSnapshot(postsQuery, (snapshot) => {
            messagesList.innerHTML = "";
            if (snapshot.empty) {
                messagesList.innerHTML = "<p>Aún no hay mensajes. ¡Sé el primero en escribir uno!</p>";
                return;
            }

            snapshot.forEach((docSnapshot) => {
                renderMessage(docSnapshot.id, docSnapshot.data());
            });
        });

        // Enviar nuevo mensaje
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const author = authorInput.value.trim();
            const text = messageInput.value.trim();

            if (!author || !text) return;

            try {
                submitBtn.disabled = true;
                statusMessage.textContent = "Guardando mensaje...";

                await addDoc(collection(db, "birthday_posts"), {
                    author: author,
                    text: text,
                    createdAt: serverTimestamp()
                });

                statusMessage.textContent = "¡Mensaje guardado con éxito! 🎉";
                form.reset();
            } catch (error) {
                console.error("Error:", error);
                statusMessage.textContent = "Error al guardar el mensaje.";
            } finally {
                submitBtn.disabled = false;
                setTimeout(() => { statusMessage.textContent = ""; }, 4000);
            }
        });

        // Renderizar cada mensaje con botón de eliminación
        function renderMessage(id, { author, text }) {
            const div = document.createElement('div');
            div.className = 'message-item';
            div.innerHTML = `
                <div class="message-content">
                    <strong>${escapeHTML(author)}</strong>
                    <p>${escapeHTML(text)}</p>
                </div>
                <button class="delete-btn" title="Eliminar mensaje">🗑️</button>
            `;

            // Evento para borrar mensaje
            const deleteBtn = div.querySelector('.delete-btn');
            deleteBtn.addEventListener('click', () => deleteMessage(id));

            messagesList.appendChild(div);
        }

        // Función para validar contraseña y eliminar de Firestore
        async function deleteMessage(id) {
            const inputPassword = prompt("Ingresa la contraseña para eliminar este mensaje:");
            if (inputPassword === null) return; // Cancelado por el usuario

            if (inputPassword === ADMIN_PASSWORD) {
                try {
                    await deleteDoc(doc(db, "birthday_posts", id));
                    alert("Mensaje eliminado con éxito.");
                } catch (error) {
                    console.error("Error al eliminar:", error);
                    alert("Ocurrió un error al intentar eliminar el mensaje.");
                }
            } else {
                alert("Contraseña incorrecta. No tienes permiso para eliminar este mensaje.");
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
